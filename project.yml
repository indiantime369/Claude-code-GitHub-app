name: ShazamSpotifySync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  ShazamSpotifySync:
    type: application
    platform: iOS
    sources:
      - ShazamSpotifySync
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shazamspotifysync
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ShazamSpotifySync/Info.plist
      properties:
        CFBundleDisplayName: ShazSync
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.shazamspotifysync.spotify
            CFBundleURLSchemes: [shazamspotifysync]
        NSAppleMusicUsageDescription: ShazSync reads the "My Shazam Tracks" playlist that the Shazam app keeps in your Apple Music library, so it can copy those songs to Spotify.
        NSMicrophoneUsageDescription: ShazSync listens through the microphone only while you tap Identify, to recognize the song that is playing.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.shazamspotifysync.refresh]
  ShazamSpotifySyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShazamSpotifySyncTests
    dependencies:
      - target: ShazamSpotifySync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShazamSpotifySync:
    build:
      targets:
        ShazamSpotifySync: all
        ShazamSpotifySyncTests: [test]
    test:
      targets:
        - ShazamSpotifySyncTests
